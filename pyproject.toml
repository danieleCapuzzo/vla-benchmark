[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vla-benchmark"
version = "0.1.0"
description = "Benchmark harness for evaluating VLA / MaIL policies on LIBERO"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = { file = "LICENSE" }

# NOTE: torch, causal-conv1d, mamba-ssm (and its selective-scan CUDA kernels) are
# intentionally NOT listed here. They are hardware/CUDA-version specific and must be
# installed *before* this project, following README.md -- run
# `python tests/test_env_setup.py` afterwards to verify they're present and working.
dependencies = [
    "einops>=0.8,<0.9",
    "numpy>=1.26,<2.0",
    "opencv-python==4.6.0.66",
    "pillow>=12.0",
    "matplotlib>=3.10,<3.11",
    "tqdm>=4.70,<5.0",
    "accelerate>=0.30,<0.31",
    "peft==0.11.1",
    "transformers==4.40.1",
    "tokenizers==0.19.1",
    "sentencepiece==0.1.99",
    "timm==0.9.10",
    "draccus==0.8.0",
    "huggingface_hub",
    "safetensors",
    "json-numpy",
    "jsonlines",
    "protobuf",
    "rich",
    "wandb>=0.28,<0.29",
    "hydra-core>=1.3,<1.4",
    "omegaconf>=2.3,<2.4",
    "easydict>=1.13",
    "cloudpickle>=3.1",
    "future>=1.0",
    "thop",
    "gym==0.26.2",
    "gymnasium>=1.3,<2.0",
    "mujoco>=3.9,<4.0",
    "robomimic==0.3.0",
    "robosuite==1.4.1",
    "bddl==1.0.1",
    "egl_probe",
    "imageio[ffmpeg]",
    "tensorflow==2.15.0",
    "tensorflow_datasets==4.9.3",
    "tensorflow_graphics==2021.12.3",
    "diffusers==0.30.3",
    "uvicorn",
    "fastapi",
    "dlimp @ git+https://github.com/moojink/dlimp_openvla",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "pytest-mock>=3.15",
]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
