[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vla-benchmark"
version = "0.1.0"
description = "Benchmark harness for evaluating VLA / MaIL policies on LIBERO"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = { file = "LICENSE" }

# NOTE: torch, causal-conv1d, mamba-ssm (and its selective-scan CUDA kernels) are
# intentionally NOT listed here. They are hardware/CUDA-version specific and must be
# installed *before* this project, following README.md -- run
# `python tests/test_env_setup.py` afterwards to verify they're present and working.
dependencies = [
    "einops>=0.8,<0.9",
    "numpy>=1.26,<2.0",
    "opencv-python==4.6.0.66",
    "pillow>=12.0",
    "matplotlib>=3.10,<3.11",
    "tqdm>=4.70,<5.0",
    "accelerate>=0.30,<0.31",
    "peft==0.11.1",
    "transformers==4.40.1",
    "tokenizers==0.19.1",
    "sentencepiece==0.1.99",
    "timm==0.9.10",
    "draccus==0.8.0",
    "huggingface_hub",
    "safetensors",
    "json-numpy",
    "jsonlines",
    "protobuf",
    "rich",
    "wandb>=0.28,<0.29",
    "hydra-core>=1.3,<1.4",
    "omegaconf>=2.3,<2.4",
    "easydict>=1.13",
    "cloudpickle>=3.1",
    "future>=1.0",
    "thop",
    "gym==0.26.2",
    "gymnasium>=1.3,<2.0",
    "mujoco>=3.9,<4.0",
    "robomimic==0.3.0",
    "robosuite==1.4.1",
    "bddl==1.0.1",
    "egl_probe",
    "imageio[ffmpeg]",
    "tensorflow==2.15.0",
    "tensorflow_datasets==4.9.3",
    "tensorflow_graphics==2021.12.3",
    "diffusers==0.30.3",
    "uvicorn",
    "fastapi",
    "dlimp @ git+https://github.com/moojink/dlimp_openvla",
]

# openvla and openvla-oft are vendored subdirectories of this repo, each with their own
# build metadata (openvla/pyproject.toml, openvla-oft/pyproject.toml). pip has no
# portable way to reference a *relative* local path from inside [project.dependencies]
# (file:// URLs must be absolute), so they are installed as separate editable installs
# in README.md instead of being listed here.
#
# `libero` (github.com/huggingface/lerobot-libero, on PyPI) is deliberately NOT listed
# here either, even though it's a normal PyPI package: its metadata hard-pins
# robomimic==0.2.0, which conflicts with robomimic==0.3.0 above (the version LIBERO's
# code actually runs against in this project). Installing libero in the same resolve as
# this project is therefore impossible for pip to satisfy. README.md installs it
# separately with `--no-deps`, after robomimic/robosuite/bddl/egl_probe are already in
# place from this file, the same way the vendored openvla/openvla-oft installs work.
# The LIBERO/ subdirectory in this repo is NOT used for this -- it's an older,
# differently-packaged fork whose editable install is broken (setup.py's package
# discovery finds nothing to map).

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "pytest-mock>=3.15",
]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
